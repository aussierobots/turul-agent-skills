[package]
name = "turul-agent-skills-cli"
description = "skills-ref compatible command line for Agent Skills (SKILL.md)"
readme = "README.md"
# The CLI tests run over the library's fixtures, which are not in this package.
exclude = ["tests/cli.rs"]
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
keywords.workspace = true
categories = ["command-line-utilities"]
rust-version.workspace = true
documentation = "https://docs.rs/turul-agent-skills-cli"
homepage.workspace = true

[dependencies]
turul-agent-skills = { workspace = true }
clap = { workspace = true }

[dev-dependencies]
assert_cmd = { workspace = true }
serde_json = { workspace = true }
tempfile = { workspace = true }

[[bin]]
name = "turul-skills"
path = "src/main.rs"
