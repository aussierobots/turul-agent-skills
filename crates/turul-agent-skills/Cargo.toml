[package]
name = "turul-agent-skills"
description = "Parse, validate, render and catalog Agent Skills (SKILL.md) directories"
readme = "README.md"
# Tests that read the rest of the workspace (root README, examples, every crate) are not published.
exclude = [
    "tests/dependency_direction.rs",
    "tests/example_skills.rs",
    "tests/readme_snippets.rs",
    "tests/single_owner.rs",
]
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
keywords.workspace = true
categories = ["parser-implementations"]
rust-version.workspace = true

[dependencies]
unicode-normalization = { workspace = true }
unicode-properties = { workspace = true }
saphyr-parser = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
toml = { workspace = true }
serde_json = { workspace = true, features = ["preserve_order"] }
tempfile = { workspace = true }
